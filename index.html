<!doctype html><html lang="ar" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>مبادرة دقيقة إبداع</title><style>*{box-sizing:border-box}body{margin:0;font-family:Tahoma,Arial,sans-serif;background:#fff;min-height:100vh;display:grid;place-items:center;padding:18px}.game{width:min(100%,620px);border:3px solid #afd7ee;border-radius:30px;padding:24px 18px;text-align:center}h1{font-size:clamp(22px,5vw,30px);color:#3172c8;margin:0 0 10px}.credit{font-size:19px;line-height:1.9;font-weight:600}hr{border:0;border-top:1px solid #ddd;margin:24px 0}h2{font-size:clamp(21px,5vw,27px);line-height:1.7}p{color:#666;font-size:18px}.choices{display:grid;grid-template-columns:1fr 1fr;gap:15px;margin:22px 0}.choice{font-family:inherit;font-size:24px;min-height:72px;border-radius:40px;background:#f5f5f5;border:2px solid #d5d5d5;color:#222;cursor:pointer;touch-action:manipulation}.choice.correct{background:#439d4e;border-color:#439d4e;color:white}.choice.wrong{background:#df5151;border-color:#df5151;color:white}.choice:focus-visible,.reset:focus-visible{outline:3px solid #247cdb;outline-offset:3px}#feedback{min-height:110px;display:grid;place-content:center;gap:8px;font-size:22px;font-weight:bold}#feedback.good{color:#287d35}#feedback.bad{color:#c52e36}.reset{width:100%;border-radius:40px;background:white;border:2px solid #ddd;color:#666;font:18px Tahoma,Arial;padding:13px;cursor:pointer}.star{position:fixed;top:-40px;pointer-events:none;animation:fall 2.7s linear forwards}@keyframes fall{to{transform:translateY(110vh) rotate(500deg);opacity:0}}@media(max-width:380px){.game{padding:20px 10px}.choice{font-size:21px;min-height:65px}.credit{font-size:16px}}</style></head><body><main class="game"><h1>🌟 مبادرة دقيقة إبداع 🌟</h1><div class="credit">المعلمة / بدرية الشنفري<br>مشاركة / نورة المبرد</div><hr><h2>ما المضاعف المشترك الأصغر للعددين ١٢ و١٨؟</h2><p>👇 اختاري الإجابة الصحيحة</p><section class="choices"><button class="choice" data-answer="0">أ) ٢٤</button><button class="choice" data-answer="1">ب) ٣٦</button><button class="choice" data-answer="0">ج) ٧٢</button><button class="choice" data-answer="0">د) ٢١٦</button></section><div id="feedback" role="status" aria-live="polite"></div><button class="reset" id="reset">↻ إعادة اللعب</button></main><script>const buttons=[...document.querySelectorAll('.choice')],feedback=document.getElementById('feedback');let finished=false;buttons.forEach(b=>b.addEventListener('click',()=>{if(finished)return;buttons.forEach(x=>x.classList.remove('wrong'));if(b.dataset.answer==='1'){finished=true;b.classList.add('correct');feedback.className='good';feedback.innerHTML='<div>🌟 🏆 🌟</div><div>إجابة صحيحة! أحسنتِ يا مبدعة</div><div>المضاعف المشترك الأصغر هو ٣٦</div>';for(let i=0;i<30;i++){const s=document.createElement('span');s.className='star';s.textContent=['⭐','🌟','✨'][i%3];s.style.left=Math.random()*100+'vw';s.style.animationDelay=Math.random()*.8+'s';document.body.append(s);setTimeout(()=>s.remove(),4000)}}else{b.classList.add('wrong');feedback.className='bad';feedback.textContent='❌ حاولي مرة أخرى يا مبدعة 💕'}}));document.getElementById('reset').addEventListener('click',()=>{finished=false;buttons.forEach(b=>b.classList.remove('correct','wrong'));feedback.className='';feedback.textContent=''})</script></body></html>
